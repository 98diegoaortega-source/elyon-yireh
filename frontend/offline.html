<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a5c3a" />
    <title>Sin conexión | ELYON YIREH</title>
    <style>
      :root { font-family: Inter, Arial, sans-serif; color: #17233d; background: #f1f5f9; }
      body { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 24px; box-sizing: border-box; }
      main { width: min(100%, 480px); padding: 36px 28px; text-align: center; background: #fff; border: 1px solid #dfe6f0; border-radius: 16px; box-shadow: 0 10px 25px rgba(0, 0, 0, .05); }
      img { width: 84px; height: 84px; object-fit: contain; }
      h1 { margin: 20px 0 8px; font-size: 24px; }
      p { margin: 0 0 24px; color: #64748b; }
      button { border: 0; border-radius: 8px; padding: 13px 24px; background: #06663d; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
      button:hover { background: #075a37; }
    </style>
  </head>
  <body>
    <main>
      <img src="/assets/elyon-yireh.png" alt="ELYON YIREH" />
      <h1>Sin conexión a internet</h1>
      <p>Conéctate a internet para consultar la información académica más reciente.</p>
      <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>
